# Esqueleto de empaquetado — modo SaaS (P-02, P-03).
#
# Mismo código base que docker-compose.onprem.yml; lo que cambia por modo es la
# IMPLEMENTACIÓN detrás de cada interfaz de P-03 (almacenamiento de objetos, OCR,
# embeddings, inferencia LLM, índice vectorial, índice léxico), nunca el código de
# orquestación. Dockerfiles reales ya wireados para captura-ingesta,
# records-custodia (T-18), seguridad-acceso (T-26), validacion-humana (T-31),
# normalizacion (T-35), extraccion (T-42) y clasificacion (T-46,
# specs/spec-infra-servicios.md); el resto de contextos los suma cuando tengan
# código. validacion-humana y clasificacion no tienen Postgres propio (T-30:
# orquestador HTTP sobre records-custodia y seguridad-acceso; T-46: orquestador
# HTTP sobre records-custodia — ninguno mantiene persistencia propia).
# normalizacion, extraccion y clasificacion son contenedores Python/FastAPI
# (build en dos etapas con `uv`, mismo patrón que los Dockerfiles Kotlin pero
# con `uv sync --no-dev` en vez de `-x test`).
#
# TODO por contexto, cuando exista su Dockerfile:
#   - contexts/enriquecimiento     (Python/FastAPI)
#   - contexts/indexacion-busqueda (Python/FastAPI)
#
# TODO — implementaciones SaaS (gestionadas) de las seis capacidades de P-03:
#   almacenamiento de objetos, OCR, embeddings, inferencia LLM, índice vectorial,
#   índice léxico. En este modo la mayoría son servicios externos gestionados, no
#   contenedores locales — se configuran vía variables de entorno, no código.

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: sgdea
      POSTGRES_USER: sgdea
      POSTGRES_PASSWORD: sgdea
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # specs/spec-infra-servicios.md §2: Postgres por contexto sin esquema
  # compartido, pero el mismo servidor `postgres` de arriba — cada contexto
  # solo toca sus propias tablas (lotes_ingesta/items_ingesta aquí;
  # originales_inmutables/documentos_archivo/... en records-custodia).
  captura-ingesta:
    build:
      context: ..
      dockerfile: contexts/captura-ingesta/Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: sgdea
      DB_USER: sgdea
      DB_PASSWORD: sgdea
    depends_on:
      - postgres
    # Sin `ports:` a propósito — specs/spec-infra-servicios.md §7: sin el
    # contexto Seguridad y Acceso, este servicio no debe exponerse fuera de
    # la red interna de docker-compose. Otros servicios del compose lo
    # alcanzan por nombre (`captura-ingesta:8081`).

  records-custodia:
    build:
      context: ..
      dockerfile: contexts/records-custodia/Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: sgdea
      DB_USER: sgdea
      DB_PASSWORD: sgdea
    depends_on:
      - postgres
    # Mismo tratamiento que captura-ingesta: sin `ports:` hasta que
    # captura-ingesta/records-custodia llamen de verdad a seguridad-acceso
    # (specs/spec-infra-servicios.md §8 — el contexto ya existe, T-23/T-25,
    # pero esa integración todavía no).

  # T-23/T-25: primer contexto Kotlin/Spring además de los dos originales.
  # Sin `ports:` a propósito, mismo criterio que los otros dos — expone
  # /autorizacion para que cualquier servicio de esta red lo consulte
  # (`seguridad-acceso:8083`), pero no hace falta llegar a él desde el host.
  seguridad-acceso:
    build:
      context: ..
      dockerfile: contexts/seguridad-acceso/Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: sgdea
      DB_USER: sgdea
      DB_PASSWORD: sgdea
    depends_on:
      - postgres

  # T-29/T-30: sin Postgres — orquesta records-custodia y seguridad-acceso por
  # HTTP real (primera integración entre servicios de este proyecto). Sin
  # `ports:`, mismo criterio que los otros tres.
  validacion-humana:
    build:
      context: ..
      dockerfile: contexts/validacion-humana/Dockerfile
    environment:
      RECORDS_CUSTODIA_BASE_URL: http://records-custodia:8082
      SEGURIDAD_ACCESO_BASE_URL: http://seguridad-acceso:8083
      # T-38 (cierra RF-VH-005): primer consumidor real de
      # POST /unidades/{id}/confirmacion-limites en normalizacion.
      NORMALIZACION_BASE_URL: http://normalizacion:8085
    depends_on:
      - records-custodia
      - seguridad-acceso
      - normalizacion

  # T-33/T-34/T-35: primer contenedor Python/FastAPI. Postgres propio (a
  # diferencia de validacion-humana): normalizacion sí mantiene estado
  # propio (unidades documentales candidatas), spec §3 de este contexto no
  # dice lo mismo que dice specs/007-validacion-humana/spec.md §3.
  normalizacion:
    build:
      context: ..
      dockerfile: contexts/normalizacion/Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: sgdea
      DB_USER: sgdea
      DB_PASSWORD: sgdea
      SERVER_PORT: "8085"
    depends_on:
      - postgres

  # T-40/T-41/T-41b: segundo contenedor Python/FastAPI. Postgres propio
  # (mismo criterio que normalizacion: mantiene estado propio, textos
  # extraídos). RF-EX-011/P-03: confirmar_extraccion verifica autorización
  # real contra seguridad-acceso (POST /autorizacion), primer consumidor
  # Python de ese endpoint.
  extraccion:
    build:
      context: ..
      dockerfile: contexts/extraccion/Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: sgdea
      DB_USER: sgdea
      DB_PASSWORD: sgdea
      SERVER_PORT: "8086"
      SEGURIDAD_ACCESO_BASE_URL: http://seguridad-acceso:8083
    depends_on:
      - postgres
      - seguridad-acceso

  # T-44/T-45: tercer contenedor Python/FastAPI. Sin Postgres propio (mismo
  # criterio que validacion-humana): orquestador HTTP puro que reenvía cada
  # sugerencia a POST /sugerencias de records-custodia.
  clasificacion:
    build:
      context: ..
      dockerfile: contexts/clasificacion/Dockerfile
    environment:
      RECORDS_CUSTODIA_BASE_URL: http://records-custodia:8082
      SERVER_PORT: "8087"
    depends_on:
      - records-custodia

volumes:
  postgres-data:
