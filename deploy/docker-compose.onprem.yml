# Esqueleto de empaquetado — modo appliance on-premise (P-02, P-03, P-10).
#
# Mismo código base que docker-compose.saas.yml. En este modo TODA capacidad
# externa debe ser autoalojada — el appliance debe operar sin conectividad
# saliente, incluso en entornos aislados (P-10). Dockerfiles reales ya
# wireados para captura-ingesta, records-custodia (T-18), seguridad-acceso
# (T-26), validacion-humana (T-31), normalizacion (T-35), extraccion (T-42),
# clasificacion (T-46) y enriquecimiento (T-51,
# specs/spec-infra-servicios.md) — son los mismos que en modo SaaS (P-02: un
# solo código base); ninguno tiene todavía una capacidad externa de P-03 que
# abstraer (seguridad-acceso es autoalojado por diseño desde T-23;
# validacion-humana, clasificacion y enriquecimiento no tienen Postgres
# propio, T-30/T-46/T-51; normalizacion y extraccion solo usan Postgres, sin
# ningún componente probabilístico real detrás de
# `recibir_sugerencia_de_limites`/`recibir_sugerencia_ocr` — ambos son
# FICTICIOS, T-33/T-40; clasificacion/enriquecimiento tampoco tienen ninguno
# real detrás de `clasificar`/`agrupar`/`evaluar_texto`, T-44/T-49).
# indexacion-busqueda (T-56) tampoco: `IndiceLexicoAutoalojado`/
# `IndiceVectorialAutoalojado` son las variantes que se inyectan por
# defecto (Postgres, sin salida de red) — coherente con P-10 en este modo.
#
# TODO — implementaciones self-hosted de las seis capacidades de P-03, cada una
# como contenedor local (candidatas a evaluar, no decididas todavía):
#   - almacenamiento de objetos → p. ej. MinIO
#   - OCR                        → motor autoalojado (se usa/ajusta uno existente,
#                                   ver disciplina de alcance de la constitución)
#   - embeddings                 → modelo autoalojado
#   - inferencia LLM             → runtime autoalojado
#   - índice vectorial           → autoalojado
#   - índice léxico              → autoalojado

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: sgdea
      POSTGRES_USER: sgdea
      POSTGRES_PASSWORD: sgdea
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # specs/spec-infra-servicios.md §2: Postgres por contexto sin esquema
  # compartido, pero el mismo servidor `postgres` de arriba — cada contexto
  # solo toca sus propias tablas (lotes_ingesta/items_ingesta aquí;
  # originales_inmutables/documentos_archivo/... en records-custodia).
  captura-ingesta:
    build:
      context: ..
      dockerfile: contexts/captura-ingesta/Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: sgdea
      DB_USER: sgdea
      DB_PASSWORD: sgdea
    depends_on:
      - postgres
    # Sin `ports:` a propósito — specs/spec-infra-servicios.md §7: sin el
    # contexto Seguridad y Acceso, este servicio no debe exponerse fuera de
    # la red interna de docker-compose. Otros servicios del compose lo
    # alcanzan por nombre (`captura-ingesta:8081`).

  records-custodia:
    build:
      context: ..
      dockerfile: contexts/records-custodia/Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: sgdea
      DB_USER: sgdea
      DB_PASSWORD: sgdea
    depends_on:
      - postgres
    # Mismo tratamiento que captura-ingesta: sin `ports:` hasta que
    # captura-ingesta/records-custodia llamen de verdad a seguridad-acceso
    # (specs/spec-infra-servicios.md §8 — el contexto ya existe, T-23/T-25,
    # pero esa integración todavía no).

  seguridad-acceso:
    build:
      context: ..
      dockerfile: contexts/seguridad-acceso/Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: sgdea
      DB_USER: sgdea
      DB_PASSWORD: sgdea
    depends_on:
      - postgres

  validacion-humana:
    build:
      context: ..
      dockerfile: contexts/validacion-humana/Dockerfile
    environment:
      RECORDS_CUSTODIA_BASE_URL: http://records-custodia:8082
      SEGURIDAD_ACCESO_BASE_URL: http://seguridad-acceso:8083
      # T-38 (cierra RF-VH-005): primer consumidor real de
      # POST /unidades/{id}/confirmacion-limites en normalizacion.
      NORMALIZACION_BASE_URL: http://normalizacion:8085
    depends_on:
      - records-custodia
      - seguridad-acceso
      - normalizacion

  normalizacion:
    build:
      context: ..
      dockerfile: contexts/normalizacion/Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: sgdea
      DB_USER: sgdea
      DB_PASSWORD: sgdea
      SERVER_PORT: "8085"
    depends_on:
      - postgres

  extraccion:
    build:
      context: ..
      dockerfile: contexts/extraccion/Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: sgdea
      DB_USER: sgdea
      DB_PASSWORD: sgdea
      SERVER_PORT: "8086"
      SEGURIDAD_ACCESO_BASE_URL: http://seguridad-acceso:8083
    depends_on:
      - postgres
      - seguridad-acceso

  # T-44/T-45: tercer contenedor Python/FastAPI. Sin Postgres propio (mismo
  # criterio que validacion-humana): orquestador HTTP puro que reenvía cada
  # sugerencia a POST /sugerencias de records-custodia.
  clasificacion:
    build:
      context: ..
      dockerfile: contexts/clasificacion/Dockerfile
    environment:
      RECORDS_CUSTODIA_BASE_URL: http://records-custodia:8082
      SERVER_PORT: "8087"
    depends_on:
      - records-custodia

  # T-49/T-50: cuarto contenedor Python/FastAPI. Sin Postgres propio (mismo
  # criterio que validacion-humana/clasificacion): orquestador HTTP puro que
  # reenvía cada sugerencia de metadatos a POST /sugerencias de
  # records-custodia (tipo="metadato").
  enriquecimiento:
    build:
      context: ..
      dockerfile: contexts/enriquecimiento/Dockerfile
    environment:
      RECORDS_CUSTODIA_BASE_URL: http://records-custodia:8082
      SERVER_PORT: "8088"
    depends_on:
      - records-custodia

  # T-54/T-55/T-56: quinto contenedor Python/FastAPI. Postgres propio (mismo
  # criterio que normalizacion/extraccion). RF-IB-008/009: filtra
  # resultados y registra acceso verificando autorización real contra
  # seguridad-acceso. Sin salida de red — coherente con P-10 en modo
  # appliance (las variantes AUTOALOJADAS son las que se inyectan por
  # defecto, no las gestionadas).
  indexacion-busqueda:
    build:
      context: ..
      dockerfile: contexts/indexacion-busqueda/Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: sgdea
      DB_USER: sgdea
      DB_PASSWORD: sgdea
      SERVER_PORT: "8089"
      SEGURIDAD_ACCESO_BASE_URL: http://seguridad-acceso:8083
    depends_on:
      - postgres
      - seguridad-acceso

volumes:
  postgres-data:
