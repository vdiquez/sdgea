name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Build (Gradle)
        run: ./gradlew build --no-daemon

  build-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
      - name: Sync workspace
        run: uv sync --all-packages
      - name: Pruebas del arnés EDD
        run: uv run --directory eval-harness pytest

# TODO: job que ejecuta el arnés EDD contra un set patrón real como gate de
# liberación (edd-harness.md §5.4) — se añade cuando exista un componente
# probabilístico real que evaluar. El paso de arriba solo corre las pruebas del
# software del arnés, no un gate de EDD.
