[project]
name = "enriquecimiento"
version = "0.1.0"
description = "Bounded context Enriquecimiento (specs/004-enriquecimiento/spec.md)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # T-50: cliente HTTP real de EnviadorDeSugerenciasHttp (integracion.py)
    # contra POST /sugerencias en records-custodia — sin persistencia propia,
    # es la única dependencia externa de este contexto además de FastAPI.
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
