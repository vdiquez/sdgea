[project]
name = "normalizacion"
version = "0.1.0"
description = "Bounded context Normalización (specs/001-normalizacion/spec.md)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
pythonpath = ["."]
