[project]
name = "indexacion-busqueda"
version = "0.1.0"
description = "Bounded context Indexación y Búsqueda (specs/005-indexacion-busqueda/spec.md)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    # P-03: cliente HTTP real de VerificadorDePermisos (integracion.py) contra
    # seguridad-acceso, mismo criterio que VerificadorDeAutorizacionHttp en
    # extraccion (T-41b) -- ya no solo dependencia de test.
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
