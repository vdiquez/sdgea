# specs/008-ui-demo/spec.md §1/§4: proxy inverso curado -- el navegador solo
# alcanza este servidor, nunca un puerto interno de docker-compose
# directamente (RNF-UI-001). Cada bloque `location /api/<contexto>/` reenvía
# sin modificar el contrato al servicio interno correspondiente (nombre de
# servicio de docker-compose.saas.yml, resuelto por el DNS interno de Docker).
# Captura/Ingesta deliberadamente NO tiene bloque aquí -- sigue bloqueada por
# el prerrequisito de arquitectura de §1 (ver STATE.md/TODO.md T-63); ese
# mismo prerrequisito para Records/Custodia ya se cerró (T-63,
# VerificadorDeAutorizacion real contra POST /autorizacion) y su bloque
# aparece abajo.
server {
    listen 80;

    location /api/seguridad-acceso/ {
        proxy_pass http://seguridad-acceso:8083/;
    }

    # T-63: records-custodia ya verifica la autorización real de `identidadId`
    # en cada endpoint que esta capa necesita (original, documento,
    # sugerencias, verificacion-integridad, eventos-auditoria) -- los demás
    # (custodiar, procedencia, correcciones) nunca los llama el navegador y
    # siguen sin verificación, sin que eso reabra el prerrequisito de §1.
    location /api/records-custodia/ {
        proxy_pass http://records-custodia:8082/;
    }

    location /api/validacion-humana/ {
        proxy_pass http://validacion-humana:8084/;
    }

    location /api/normalizacion/ {
        proxy_pass http://normalizacion:8085/;
    }

    location /api/extraccion/ {
        proxy_pass http://extraccion:8086/;
    }

    location /api/clasificacion/ {
        proxy_pass http://clasificacion:8087/;
    }

    location /api/enriquecimiento/ {
        proxy_pass http://enriquecimiento:8088/;
    }

    location /api/indexacion-busqueda/ {
        proxy_pass http://indexacion-busqueda:8089/;
    }

    # SPA de React (react-router en modo historial): cualquier ruta que no
    # sea /api/... ni un archivo estático real cae a index.html.
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
