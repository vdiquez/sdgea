# specs/008-ui-demo/spec.md §1/§4: proxy inverso curado -- el navegador solo
# alcanza este servidor, nunca un puerto interno de docker-compose
# directamente (RNF-UI-001). Para los contextos SIN restricción de §10, cada
# bloque `location /api/<contexto>/` reenvía sin modificar el contrato al
# servicio interno correspondiente (nombre de servicio de
# docker-compose.saas.yml, resuelto por el DNS interno de Docker).
# Captura/Ingesta deliberadamente NO tiene bloque aquí -- sigue bloqueada por
# el prerrequisito de arquitectura de §1 (ver STATE.md/TODO.md T-63).
# Records/Custodia cerró ese mismo prerrequisito (T-63, VerificadorDeAutorizacion
# real contra POST /autorizacion), pero SOLO para cinco endpoints -- su bloque,
# más abajo, es deliberadamente explícito por ruta+método en vez de un prefijo
# genérico, y no reenvía nada fuera de esos cinco (ver el bloque mismo).
server {
    listen 80;

    # T-63: cualquier variable dentro de `proxy_pass` (aquí, `$1` de las
    # capturas regex y `$is_args$args`) hace que nginx resuelva el nombre de
    # servicio EN TIEMPO DE PETICIÓN, no una sola vez al cargar la
    # configuración -- y eso exige un `resolver` explícito o nginx responde
    # 502 con "no resolver defined to resolve records-custodia" (hallazgo
    # real verificando contra Docker real: los bloques de arriba, sin
    # variables en `proxy_pass`, nunca lo necesitaron). 127.0.0.11 es el DNS
    # embebido de Docker para redes bridge de docker-compose -- mismo
    # mecanismo que ya resuelve `records-custodia`/`seguridad-acceso`/etc.
    # para el resto de este archivo, solo que en tiempo de arranque.
    resolver 127.0.0.11 valid=30s;

    location /api/seguridad-acceso/ {
        proxy_pass http://seguridad-acceso:8083/;
    }

    # T-63 (VETO real de Codex sobre el primer intento de este bloque, ver
    # STATE.md): un `location /api/records-custodia/ { proxy_pass ...; }`
    # genérico -- igual que el de los demás contextos, arriba/abajo --
    # reenviaría TODO el contrato de records-custodia, no solo los cinco
    # endpoints que verifican `identidadId`. Eso deshace la premisa de §1:
    # `custodiar`, `procedencia`, `decisiones` y `correcciones` seguirían
    # siendo alcanzables desde el navegador sin autorización -- en
    # particular `POST .../decisiones`, que RF-UI-005 exige que la UI NUNCA
    # llame directamente. Por eso, a diferencia de los demás contextos, aquí
    # se listan explícitamente los cinco métodos+rutas de T-63 -- todo lo
    # demás bajo este prefijo cae al bloque `return 404` del final, nunca a
    # records-custodia.
    location = /api/records-custodia/eventos-auditoria {
        limit_except GET { deny all; }
        proxy_pass http://records-custodia:8082/eventos-auditoria$is_args$args;
    }

    # Exacto y ANTES del regex de abajo a propósito: "correcciones" encajaría
    # también en `documentos/([^/]+)$` (mismo shape textual que un id de
    # documento) y reenviaría, sin querer, al endpoint NO protegido
    # `GET /documentos/correcciones` (RF-VH-009) -- Spring MVC lo resuelve a
    # ese handler literal, no a `documento(id="correcciones")`, precisamente
    # porque prefiere el patrón más específico (mismo criterio que el
    # comentario de DocumentosController.kt sobre por qué "/correcciones"
    # nunca choca con "/{id}" del lado de Spring; aquí el riesgo es del lado
    # del proxy, no de Spring). nginx sí evalúa los `location =` exactos
    # antes que cualquier `location ~` regex, sin importar el orden en el
    # archivo, así que esto gana siempre frente al bloque de abajo.
    location = /api/records-custodia/documentos/correcciones {
        return 404;
    }

    location ~ ^/api/records-custodia/documentos/([^/]+)/original$ {
        limit_except GET { deny all; }
        proxy_pass http://records-custodia:8082/documentos/$1/original$is_args$args;
    }

    location ~ ^/api/records-custodia/documentos/([^/]+)/sugerencias$ {
        limit_except GET { deny all; }
        proxy_pass http://records-custodia:8082/documentos/$1/sugerencias$is_args$args;
    }

    location ~ ^/api/records-custodia/documentos/([^/]+)/verificacion-integridad$ {
        limit_except POST { deny all; }
        proxy_pass http://records-custodia:8082/documentos/$1/verificacion-integridad;
    }

    location ~ ^/api/records-custodia/documentos/([^/]+)$ {
        limit_except GET { deny all; }
        proxy_pass http://records-custodia:8082/documentos/$1$is_args$args;
    }

    # Cualquier otra ruta bajo este prefijo (custodiar, procedencia,
    # decisiones, correcciones, el agregado /verificacion-integridad,
    # /sugerencias, /sugerencias/pendientes, /trd/...) nunca llega a
    # records-custodia -- ninguna de ellas la llama el navegador (ver
    # specs/008-ui-demo/spec.md §4).
    location /api/records-custodia/ {
        return 404;
    }

    location /api/validacion-humana/ {
        proxy_pass http://validacion-humana:8084/;
    }

    location /api/normalizacion/ {
        proxy_pass http://normalizacion:8085/;
    }

    location /api/extraccion/ {
        proxy_pass http://extraccion:8086/;
    }

    location /api/clasificacion/ {
        proxy_pass http://clasificacion:8087/;
    }

    location /api/enriquecimiento/ {
        proxy_pass http://enriquecimiento:8088/;
    }

    location /api/indexacion-busqueda/ {
        proxy_pass http://indexacion-busqueda:8089/;
    }

    # SPA de React (react-router en modo historial): cualquier ruta que no
    # sea /api/... ni un archivo estático real cae a index.html.
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
