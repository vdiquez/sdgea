# specs/spec-infra-servicios.md §2: Postgres por contexto, sin esquema
# compartido. El host/puerto/credenciales se parametrizan por variable de
# entorno para que el mismo código base sirva a SaaS y a on-premise (P-02) sin
# cambiar nada aquí, solo el contenedor de postgres que lo respalda.
spring:
  application:
    name: records-custodia
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sgdea}
    username: ${DB_USER:sgdea}
    password: ${DB_PASSWORD:sgdea}
  jpa:
    open-in-view: false
    hibernate:
      # Mismo tratamiento que captura-ingesta (T-16): specs/spec-infra-servicios.md
      # §4 deja el DDL exacto como decisión de implementación; no hay
      # herramienta de migración decidida (Flyway/Liquibase) en ninguna spec.
      ddl-auto: update
# T-63: primera dependencia saliente real de records-custodia -- mismo
# criterio de variable de entorno que records-custodia.base-url en
# validacion-humana (T-30).
seguridad-acceso:
  base-url: ${SEGURIDAD_ACCESO_BASE_URL:http://localhost:8083}
server:
  port: ${SERVER_PORT:8082}
